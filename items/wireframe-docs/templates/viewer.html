<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>wireframe-docs viewer</title>
<!--
  wireframe-docs viewer (templates/viewer.html) — copy next to the wireframe,
  open as: viewer.html?file=<slug>-wireframe.html  (works over file://)
  Sizes mirror convention/tree-format.md. Canonical widths are locked;
  variants are extra preview widths. Never edit sizes here without
  updating the convention doc (drift = FAIL review).
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #e4e4e7; color: #18181b; }
  #toggle {
    position: fixed; top: 12px; right: 12px; z-index: 50;
    border: 1px solid #18181b; background: #fff; padding: 6px 12px;
    font-size: 13px; cursor: pointer;
  }
  #panel {
    position: fixed; top: 52px; right: 12px; z-index: 50; width: 300px;
    background: #fff; border: 2px solid #18181b; padding: 12px;
  }
  #panel h4 { margin: 8px 0 6px; font-size: 12px; color: #52525b; }
  #panel h4:first-child { margin-top: 0; }
  .row button {
    border: 1px solid #71717a; background: #fafafa; padding: 5px 9px;
    margin: 0 4px 4px 0; font-size: 12px; cursor: pointer;
  }
  .row button.on { background: #18181b; color: #fff; border-color: #18181b; }
  .row button.base { font-weight: bold; border-width: 2px; }
  #current { margin-top: 8px; font-size: 12px; color: #52525b; }
  #gridbtn { margin-top: 8px; width: 100%; padding: 6px; cursor: pointer;
    background: #fff; border: 1px solid #18181b; font-size: 13px; }
  #stage { padding: 56px 16px 32px; text-align: center; }
  #stage iframe { border: 2px solid #18181b; background: #fff; }
  #cap { font-size: 12px; color: #52525b; margin-top: 6px; }
  #overview { display: flex; gap: 16px; align-items: flex-start; justify-content: center;
    padding: 56px 16px 32px; flex-wrap: nowrap; overflow-x: auto; }
  .cell { border: 2px solid #18181b; background: #fff; cursor: pointer; flex: none; }
  .cell .tag { font-size: 11px; background: #18181b; color: #fff; padding: 2px 6px; }
  .cell iframe { border: 0; display: block; transform-origin: top left; pointer-events: none; }
  #help { max-width: 560px; margin: 80px auto; background: #fff;
    border: 2px solid #18181b; padding: 24px; }
  code { background: #f4f4f5; padding: 1px 5px; }
</style>
</head>
<body>
<button id="toggle" title="Hiện/ẩn panel (Esc)">▦ Sizes</button>
<div id="panel" hidden>
  <h4>Loại khổ (rộng chuẩn)</h4>
  <div class="row" id="types"></div>
  <h4>Biến thể trong khổ</h4>
  <div class="row" id="variants"></div>
  <div id="current"></div>
  <button id="gridbtn">Lưới 4 khung (so 1 màn hình)</button>
</div>
<div id="stage" hidden>
  <iframe id="frame" title="wireframe single view"></iframe>
  <div id="cap"></div>
</div>
<div id="overview" hidden></div>
<div id="help" hidden>
  <b>wireframe-docs viewer</b>
  <p>Mở kèm file cần xem:</p>
  <p><code>viewer.html?file=&lt;slug&gt;-wireframe.html</code></p>
  <p>Copy file này vào cùng thư mục bản wireframe rồi mở bằng browser (chạy trực tiếp qua <code>file://</code>).</p>
</div>
<script>
(function () {
  "use strict";
  // Khóa theo convention/tree-format.md — đổi số ở đây thì phải đổi convention.
  var TYPES = {
    sm: { name: "sm · mobile",  base: 360,  variants: [320, 360, 390, 412, 430] },
    md: { name: "md · tablet",  base: 768,  variants: [768, 800, 834] },
    lg: { name: "lg · laptop",  base: 1366, variants: [1280, 1366, 1440] },
    xl: { name: "xl · desktop", base: 1920, variants: [1600, 1920, 2560] }
  };
  var FRAME_H = 720;
  function $(id) { return document.getElementById(id); }
  function fileParam() {
    var m = /[?&]file=([^&]+)/.exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }
  var file = fileParam();
  var state = { type: "lg", width: 1366, grid: false };
  if (!file) { $("help").hidden = false; return; }

  var typesEl = $("types"), varEl = $("variants");
  Object.keys(TYPES).forEach(function (k) {
    var b = document.createElement("button");
    b.textContent = k + " " + TYPES[k].base;
    b.dataset.type = k;
    b.onclick = function () { selectType(k, TYPES[k].base); };
    typesEl.appendChild(b);
  });
  function paintTypes() {
    Array.prototype.forEach.call(typesEl.children, function (b) {
      b.className = (b.dataset.type === state.type && !state.grid) ? "on" : "";
    });
  }
  function selectType(k, w) {
    state.type = k; state.width = (w || TYPES[k].base); state.grid = false;
    paintTypes(); paintVariants(); single();
  }
  function paintVariants() {
    varEl.innerHTML = "";
    TYPES[state.type].variants.forEach(function (w) {
      var b = document.createElement("button");
      b.textContent = w + (w === TYPES[state.type].base ? " ●" : "");
      if (w === TYPES[state.type].base) b.className = "base";
      if (w === state.width && !state.grid) b.className += " on";
      b.onclick = function () { state.width = w; state.grid = false; paintVariants(); single(); };
      varEl.appendChild(b);
    });
    $("current").textContent = "Đang xem: " + state.type + " · " + state.width + "px";
  }
  function single() {
    $("overview").hidden = true; $("stage").hidden = false;
    var f = $("frame");
    f.src = file; f.style.width = state.width + "px"; f.style.height = FRAME_H + "px";
    $("cap").textContent = state.type + " · " + state.width + "px (rộng chuẩn: " + TYPES[state.type].base + "px)";
  }
  $("gridbtn").onclick = function () {
    state.grid = true; paintTypes(); paintVariants();
    $("stage").hidden = true;
    var ov = $("overview"); ov.hidden = false; ov.innerHTML = "";
    var total = Object.keys(TYPES).reduce(function (s, k) { return s + TYPES[k].base; }, 0) + 3 * 16;
    var avail = Math.max(320, ov.clientWidth || document.documentElement.clientWidth - 32);
    var sc = Math.min(1, avail / total);
    Object.keys(TYPES).forEach(function (k) {
      var w = TYPES[k].base;
      var cell = document.createElement("div");
      cell.className = "cell";
      cell.style.width = Math.floor(w * sc) + "px";
      cell.style.height = Math.floor(FRAME_H * sc + 22) + "px";
      cell.style.overflow = "hidden";
      cell.title = "Bấm để xem đơn " + k + " " + w + "px";
      var tag = document.createElement("div");
      tag.className = "tag"; tag.textContent = k + " · " + w + "px";
      var fr = document.createElement("iframe");
      fr.title = k; fr.src = file;
      fr.style.width = w + "px"; fr.style.height = FRAME_H + "px";
      fr.style.transform = "scale(" + sc + ")";
      cell.appendChild(tag); cell.appendChild(fr);
      cell.onclick = function () { selectType(k); };
      ov.appendChild(cell);
    });
  };
  function togglePanel() { $("panel").hidden = !$("panel").hidden; }
  $("toggle").onclick = togglePanel;
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !$("panel").hidden) togglePanel();
  });
  selectType("lg");
})();
</script>
</body>
</html>
